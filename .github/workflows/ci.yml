name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Exact patched release (Node security release 2026-10-21, CVE-2026-111497).
          node-version: 22.23.4
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Import smoke (Node ${{ matrix.node }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 and 20 are EOL and stay only as import-compat checks for users on
        # them (no patched release exists); the active lines are pinned to the
        # 2026-10-21 security releases.
        node: [18, 20, 22.23.4, 24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: ESM import
        run: node -e "import('./dist/index.js').then(m => { if (!m.VoiceMaker) throw new Error('VoiceMaker export missing'); console.log('esm ok'); })"

      - name: CommonJS require
        run: node -e "const m = require('./dist/index.cjs'); if (!m.VoiceMaker) throw new Error('VoiceMaker export missing'); console.log('cjs ok');"
